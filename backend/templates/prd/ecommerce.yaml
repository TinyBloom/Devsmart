id: ecommerce
name: 电商平台
description: 适用于在线商城、电商平台的专用模板，强调商品管理、订单流程和支付集成
icon: "🛒"

dimensions:
  core_features: 25
  user_roles: 20
  data_entities: 30
  non_functional: 15
  integrations: 10

sections:
  - id: product_overview
    title: "1. 产品概述"
    required: true
    subsections:
      - id: one_liner
        title: "1.1 一句话描述"
        hints:
          - "例如：一个支持多商家入驻的B2C电商平台"
      - id: target_users
        title: "1.2 目标用户"
        hints:
          - "消费者、商家、管理员"
          - "各角色的核心需求"
      - id: core_value
        title: "1.3 核心价值"
        hints:
          - "购物体验优势"
          - "商家管理能力"

  - id: user_modules
    title: "2. 用户端功能"
    required: true
    subsections:
      - id: product_browse
        title: "2.1 商品浏览"
        hints:
          - "商品列表、详情、搜索、分类"
          - "筛选和排序功能"
      - id: shopping_cart
        title: "2.2 购物车"
        hints:
          - "添加、修改、删除商品"
          - "价格计算、优惠活动"
      - id: checkout
        title: "2.3 下单支付"
        hints:
          - "订单创建流程"
          - "支付方式集成"
      - id: order_management
        title: "2.4 订单管理"
        hints:
          - "订单列表、详情"
          - "取消、退款、售后"

  - id: merchant_modules
    title: "3. 商家端功能"
    required: true
    subsections:
      - id: product_management
        title: "3.1 商品管理"
        hints:
          - "商品上架、编辑、下架"
          - "库存管理"
      - id: order_processing
        title: "3.2 订单处理"
        hints:
          - "订单确认、发货"
          - "售后处理"
      - id: analytics
        title: "3.3 数据分析"
        hints:
          - "销售统计"
          - "库存预警"

  - id: admin_modules
    title: "4. 管理后台"
    required: true
    subsections:
      - id: system_management
        title: "4.1 系统管理"
        hints:
          - "用户管理、权限控制"
          - "系统配置"
      - id: content_management
        title: "4.2 内容管理"
        hints:
          - "首页轮播、活动管理"
          - "商品审核"

  - id: data_models
    title: "5. 数据模型"
    required: true
    subsections:
      - id: entities
        title: "5.1 核心实体"
        hints:
          - "User, Product, Order, Cart, Payment"
          - "每个实体的关键字段"
      - id: relations
        title: "5.2 实体关系"
        hints:
          - "用户-订单、订单-商品等关系"

  - id: payment_integrations
    title: "6. 支付集成"
    required: true
    subsections:
      - id: payment_methods
        title: "6.1 支付方式"
        hints:
          - "微信支付、支付宝、银行卡"
          - "支付回调处理"
      - id: refund_process
        title: "6.2 退款流程"
        hints:
          - "退款申请、审批、执行"

  - id: non_functional
    title: "7. 非功能需求"
    required: true
    subsections:
      - id: performance
        title: "7.1 性能要求"
        hints:
          - "高并发场景处理"
          - "秒杀活动支持"
      - id: security
        title: "7.2 安全要求"
        hints:
          - "支付安全、数据加密"
          - "防刷单、防恶意攻击"
