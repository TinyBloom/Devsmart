id: general_saas
name: 通用SaaS产品
description: 适用于大多数Web应用和SaaS产品的通用模板，包含完整的产品需求文档结构
icon: "🏢"

dimensions:
  core_features: 30
  user_roles: 15
  data_entities: 25
  non_functional: 15
  integrations: 15

sections:
  - id: product_overview
    title: "1. 产品概述"
    required: true
    description: 产品的基本信息和定位
    subsections:
      - id: one_liner
        title: "1.1 一句话描述"
        hints:
          - "用一句话概括你的产品"
          - "例如：一款帮助团队高效协作的项目管理工具"
      - id: target_users
        title: "1.2 目标用户"
        hints:
          - "谁会使用你的产品？"
          - "用户的核心需求是什么？"
      - id: core_value
        title: "1.3 核心价值"
        hints:
          - "你的产品解决了什么问题？"
          - "相比竞品有什么优势？"

  - id: functional_modules
    title: "2. 功能模块"
    required: true
    description: 产品的主要功能模块
    subsections:
      - id: modules_list
        title: "2.1 模块列表"
        hints:
          - "列出产品的主要功能模块"
          - "每个模块包含哪些功能点？"
      - id: user_stories
        title: "2.2 用户故事"
        hints:
          - "As a [用户角色], I want [做什么], so that [达到什么目标]"
          - "为每个核心功能编写用户故事"

  - id: data_models
    title: "3. 数据模型"
    required: true
    description: 产品的数据实体和关系
    subsections:
      - id: entities
        title: "3.1 实体列表"
        hints:
          - "系统中有哪些核心数据实体？"
          - "每个实体有哪些字段？"
      - id: relations
        title: "3.2 实体关系"
        hints:
          - "实体之间是什么关系？"
          - "一对一、一对多、多对多？"

  - id: api_endpoints
    title: "4. API接口"
    required: false
    description: 对外提供的API接口
    subsections:
      - id: endpoints_list
        title: "4.1 接口列表"
        hints:
          - "列出主要API接口"
          - "路径、方法、权限要求"

  - id: non_functional
    title: "5. 非功能需求"
    required: true
    description: 性能、安全、扩展性等要求
    subsections:
      - id: performance
        title: "5.1 性能要求"
        hints:
          - "响应时间要求？"
          - "并发用户数？"
      - id: security
        title: "5.2 安全要求"
        hints:
          - "认证方式？"
          - "数据加密要求？"
      - id: scalability
        title: "5.3 扩展性要求"
        hints:
          - "如何应对增长？"
          - "技术选型考虑？"

  - id: integrations
    title: "6. 外部集成"
    required: false
    description: 需要集成的第三方服务
    subsections:
      - id: third_party
        title: "6.1 第三方服务"
        hints:
          - "需要集成哪些第三方服务？"
          - "支付、登录、通知等？"

  - id: test_plan
    title: "7. 测试计划"
    required: true
    description: 完整的测试计划，包含单元测试、集成测试和端到端测试
    subsections:
      - id: unit_tests
        title: "7.1 单元测试"
        hints:
          - "针对每个核心功能模块编写单元测试"
          - "覆盖正常路径和边界条件"
          - "测试文件路径：tests/unit/"
      - id: integration_tests
        title: "7.2 集成测试"
        hints:
          - "测试模块间交互、数据库操作、API调用"
          - "测试文件路径：tests/integration/"
      - id: e2e_tests
        title: "7.3 端到端测试（Playwright）"
        hints:
          - "测试用户完整流程"
          - "包含页面导航、表单填写、按钮点击等场景"
          - "测试文件路径：tests/e2e/"
      - id: test_loop
        title: "7.4 测试结果循环（CI反馈机制）"
        hints:
          - "CI 测试命令：pytest tests/unit/ -v, pytest tests/integration/ -v, npx playwright test"
          - "测试结果解析：解析 pytest/playwright 输出，提取失败测试名称、错误信息、堆栈跟踪"
          - "失败分析：根据错误信息定位问题代码，生成修复建议"
          - "代码修复：基于失败分析结果，自动生成代码补丁"
          - "重试机制：修复后重新运行失败的测试，最多重试3次"
          - "循环终止条件：所有测试通过 或 达到最大重试次数"
          - "测试覆盖率要求：单元测试覆盖率 >= 80%"

  - id: project_structure
    title: "8. 工程目录结构"
    required: true
    description: 项目的目录组织结构
    subsections:
      - id: backend_structure
        title: "8.1 后端目录结构"
        hints:
          - "src/handlers/ src/models/ src/auth/ src/error/ src/db/"
      - id: frontend_structure
        title: "8.2 前端目录结构"
        hints:
          - "src/views/ src/components/ src/stores/ src/api/ src/router/"

  - id: api_responses
    title: "9. API响应体定义"
    required: true
    description: 统一的API响应格式
    subsections:
      - id: pagination_format
        title: "9.1 分页响应格式"
        hints:
          - '{"data": [...], "total": N, "page": N, "page_size": N}'
      - id: success_response
        title: "9.2 成功响应示例"
        hints:
          - "每个接口必须提供完整的成功响应体"

  - id: error_format
    title: "10. 统一错误响应格式"
    required: true
    description: 统一的错误响应结构
    subsections:
      - id: error_structure
        title: "10.1 错误响应JSON结构"
        hints:
          - '{"code": "业务错误码", "message": "用户友好提示", "request_id": "uuid"}'
      - id: http_status
        title: "10.2 HTTP状态码映射"
        hints:
          - "400参数错误 / 401未认证 / 403无权限 / 404资源不存在 / 500服务器错误"

  - id: database_schema
    title: "11. 数据库建表SQL"
    required: true
    description: 数据库表结构定义
    subsections:
      - id: table_sql
        title: "11.1 表结构SQL"
        hints:
          - "CREATE TABLE SQL（含UNIQUE、NOT NULL、DEFAULT、FOREIGN KEY）"
      - id: indexes
        title: "11.2 索引定义"
        hints:
          - "性能索引定义（复合索引、单字段索引）"

  - id: frontend_routes
    title: "12. 前端页面清单和路由定义"
    required: false
    description: 前端页面和路由配置
    subsections:
      - id: routes_list
        title: "12.1 路由列表"
        hints:
          - "路由路径、页面组件名称、页面包含的功能区块"
